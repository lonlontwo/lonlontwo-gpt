<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐰 兔兔助理 - 專業後台管理</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+TC:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #121212;
            --bg-card: #1e1e1e;
            --bg-input: #2a2a2a;
            --primary-orange: #ff6b00;
            --text-main: #e0e0e0;
            --text-muted: #999;
            --border-color: #333;
            --danger-red: #ff4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 頂部標題 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 分頁按鈕 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--primary-orange);
            color: white;
            border-color: var(--primary-orange);
        }

        .tab-btn .badge {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        /* 卡片區域 */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .card h2 {
            font-size: 1.1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 表單樣式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary-orange);
        }

        .hint {
            font-size: 0.8rem;
            color: #666;
            margin-top: 6px;
        }

        /* API Key 專用容器 */
        .api-key-container {
            position: relative;
        }

        .toggle-visibility {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* 顏色預覽樣式 */
        .color-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="color"] {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 4px;
            background: none;
            cursor: pointer;
        }

        /* 主按鈕 (大橘色) */
        .save-btn {
            width: 100%;
            background: var(--primary-orange);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .save-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* 輔助按鈕群組 */
        .secondary-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .btn-outline {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .btn-outline:hover {
            background: var(--bg-input);
            color: var(--text-main);
        }

        .btn-quit {
            color: var(--danger-red);
            border-color: rgba(255, 68, 68, 0.3);
        }

        .btn-quit:hover {
            background: rgba(255, 68, 68, 0.1);
        }

        /* 狀態提示 */
        #status {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 9999;
            display: none;
        }

        #status.success {
            background: #2e7d32;
            color: white;
            display: block;
        }

        #status.error {
            background: #c62828;
            color: white;
            display: block;
        }

        /* 警示文字 */
        .expiry-timer {
            font-size: 0.85rem;
            color: #888;
        }

        .expiry-warning {
            color: var(--danger-red);
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        .warning-box {
            background: rgba(255, 107, 0, 0.1);
            border: 1px solid rgba(255, 107, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #cc6600;
        }

        /* 分頁隱藏控制 */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 手機 RWD */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-btn {
                flex: 1;
                min-width: 120px;
                justify-content: center;
            }

            .secondary-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🛠️ 兔兔助理後台管理</h1>
            <div id="expiryTimer" class="expiry-timer"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('basic')">
                <i class="fas fa-cog"></i> 專屬設置
            </button>
            <button class="tab-btn" onclick="switchTab('api')">
                <i class="fas fa-key"></i> API 金鑰
            </button>
            <button class="tab-btn" onclick="switchTab('knowledge')">
                <i class="fas fa-book"></i> 知識庫 <span class="badge" id="knowledgeCount">0</span>
            </button>
        </div>

        <!-- 儲存主按鈕放在分頁上方（參考圖片樣式） -->
        <button class="save-btn" onclick="saveConfig()">
            <i class="fas fa-save"></i> 儲存所有變更
        </button>

        <div style="margin-top: 25px;">
            <!-- 專屬設置分頁 -->
            <div id="tab-basic" class="tab-content active">
                <div class="card">
                    <h2>⚙️ 基本資訊</h2>
                    <div class="form-group">
                        <label>助理顯示名稱</label>
                        <input type="text" id="botName" placeholder="例如：兔兔助理">
                    </div>
                    <div class="form-group">
                        <label>頭像圖片連結 (Image URL)</label>
                        <input type="text" id="avatarUrl" placeholder="https://...">
                        <div id="avatarPreview" style="margin-top: 10px;">
                            <img id="avatarPreviewImg" src=""
                                style="width: 50px; height: 50px; border-radius: 50%; display:none; border: 1px solid var(--border-color);">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>AI 指令 (System Prompt)</label>
                        <textarea id="prompt" rows="5" placeholder="設定 AI 的個性與行為..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>快速按鈕 (請以逗號分隔)</label>
                        <input type="text" id="chips" placeholder="功能介紹, 關於我們, 聯絡站長">
                    </div>
                    <div class="form-group">
                        <label>介面主題色</label>
                        <div class="color-group">
                            <input type="color" id="color" value="#ff8fb1">
                            <span id="colorValue" style="font-family: monospace;">#ff8fb1</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- API 設定分頁 -->
            <div id="tab-api" class="tab-content">
                <div class="card">
                    <h2>🔑 認證與安全性</h2>
                    <div class="warning-box">
                        <strong>安全性提醒：</strong> API Key 將加密儲存於雲端，請確保不要外洩。
                    </div>

                    <!-- 模型商選擇 -->
                    <div class="form-group">
                        <label>🤖 使用模型商</label>
                        <select id="activeProvider" style="width:100%; background:var(--bg-input); border:1px solid var(--border-color); color:var(--text-main); padding:12px 15px; border-radius:6px; font-size:0.95rem; outline:none; cursor:pointer;" onchange="updateProviderHint()">
                            <option value="groq">Groq（預設，免費）</option>
                            <option value="gemini">Google Gemini（免費額度）</option>
                            <option value="deepseek">DeepSeek（低價）</option>
                            <option value="openai">OpenAI（GPT-4o 系列）</option>
                        </select>
                        <div class="hint" id="providerHint" style="margin-top:8px;"></div>
                    </div>

                    <!-- Groq -->
                    <div class="form-group" id="group-groq">
                        <label>Groq API 金鑰</label>
                        <div class="api-key-container">
                            <input type="password" id="groqApiKey" placeholder="gsk_...">
                            <button class="toggle-visibility" onclick="toggleKeyVisibility('groqApiKey', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="hint">前往 <a href="https://console.groq.com/keys" target="_blank" style="color:var(--primary-orange);">console.groq.com</a> 取得</div>
                    </div>

                    <!-- Gemini -->
                    <div class="form-group" id="group-gemini" style="display:none;">
                        <label>Google Gemini API 金鑰</label>
                        <div class="api-key-container">
                            <input type="password" id="geminiApiKey" placeholder="AIza...">
                            <button class="toggle-visibility" onclick="toggleKeyVisibility('geminiApiKey', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="hint">前往 <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--primary-orange);">Google AI Studio</a> 取得</div>
                    </div>

                    <!-- DeepSeek -->
                    <div class="form-group" id="group-deepseek" style="display:none;">
                        <label>DeepSeek API 金鑰</label>
                        <div class="api-key-container">
                            <input type="password" id="deepseekApiKey" placeholder="sk-...">
                            <button class="toggle-visibility" onclick="toggleKeyVisibility('deepseekApiKey', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="hint">前往 <a href="https://platform.deepseek.com/api_keys" target="_blank" style="color:var(--primary-orange);">DeepSeek Platform</a> 取得</div>
                    </div>

                    <!-- OpenAI -->
                    <div class="form-group" id="group-openai" style="display:none;">
                        <label>OpenAI API 金鑰</label>
                        <div class="api-key-container">
                            <input type="password" id="openaiApiKey" placeholder="sk-...">
                            <button class="toggle-visibility" onclick="toggleKeyVisibility('openaiApiKey', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="hint">前往 <a href="https://platform.openai.com/api-keys" target="_blank" style="color:var(--primary-orange);">OpenAI Platform</a> 取得</div>
                    </div>

                    <!-- 開放給使用者選擇的模型 -->
                    <div class="form-group">
                        <label>🔓 開放給使用者切換的模型</label>
                        <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
                            <label style="display:flex; align-items:center; gap:10px; cursor:pointer; color:var(--text-main);">
                                <input type="checkbox" id="userModel-groq" value="groq" style="width:16px; height:16px; accent-color:var(--primary-orange);">
                                🟢 Groq（Llama，免費）
                            </label>
                            <label style="display:flex; align-items:center; gap:10px; cursor:pointer; color:var(--text-main);">
                                <input type="checkbox" id="userModel-gemini" value="gemini" style="width:16px; height:16px; accent-color:var(--primary-orange);">
                                🔵 Google Gemini（免費額度）
                            </label>
                            <label style="display:flex; align-items:center; gap:10px; cursor:pointer; color:var(--text-main);">
                                <input type="checkbox" id="userModel-deepseek" value="deepseek" style="width:16px; height:16px; accent-color:var(--primary-orange);">
                                🟣 DeepSeek（低價）
                            </label>
                            <label style="display:flex; align-items:center; gap:10px; cursor:pointer; color:var(--text-main);">
                                <input type="checkbox" id="userModel-openai" value="openai" style="width:16px; height:16px; accent-color:var(--primary-orange);">
                                🟠 OpenAI（GPT，付費）
                            </label>
                        </div>
                        <div class="hint" style="margin-top:8px;">勾選 2 個或以上，前台才會顯示模型切換選單給使用者。</div>
                    </div>

                    <div class="form-group">
                        <label>API Key 到期日期</label>
                        <input type="date" id="keyExpiryDate">
                    </div>
                </div>
            </div>

            <!-- 知識庫分頁 -->
            <div id="tab-knowledge" class="tab-content">
                <div class="card">
                    <h2>📚 外部知識庫連結</h2>
                    <div class="form-group">
                        <label>資料來源 JS / TXT URL (一行一個)</label>
                        <textarea id="knowledgeUrls" rows="8" placeholder="https://example.com/data.js"></textarea>
                        <div class="hint">助理會自動讀取這些連結中的內容作為知識來源。</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="secondary-actions">
            <button class="btn-outline" onclick="loadConfig()">
                <i class="fas fa-sync-alt"></i> 重新載入設定
            </button>
            <button class="btn-outline btn-quit" onclick="closeAdmin()">
                <i class="fas fa-door-open"></i> 關閉後台視窗
            </button>
        </div>

        <div id="status"></div>
    </div>

    <!-- Firebase 原有邏輯保持不變 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTHEOqKPVA7Mj8qTUcd9pJ0YrvIgGkBCs",
            authDomain: "green-tract-416604.firebaseapp.com",
            projectId: "green-tract-416604",
            storageBucket: "green-tract-416604.firebasestorage.app",
            messagingSenderId: "1004090879489",
            appId: "1:1004090879489:web:cef299869048b5ab391a00"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 分頁切換邏輯
        window.switchTab = function (tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.currentTarget.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        };

        // 載入設定
        window.loadConfig = async function () {
            try {
                const snap = await getDoc(doc(db, "configs", "bunny-assistant"));
                if (snap.exists()) {
                    const data = snap.data();
                    document.getElementById('botName').value = data.botName || '兔兔助理';
                    document.getElementById('prompt').value = data.prompt || '';
                    document.getElementById('chips').value = data.chips || '';
                    document.getElementById('color').value = data.color || '#ff8fb1';
                    document.getElementById('colorValue').textContent = data.color || '#ff8fb1';
                    document.getElementById('knowledgeUrls').value = data.knowledgeUrls || '';
                    document.getElementById('avatarUrl').value = data.avatarUrl || '';
                    document.getElementById('keyExpiryDate').value = data.keyExpiryDate || '';
                    // 多模型 Key
                    document.getElementById('groqApiKey').value = data.groqApiKey || '';
                    document.getElementById('geminiApiKey').value = data.geminiApiKey || '';
                    document.getElementById('deepseekApiKey').value = data.deepseekApiKey || '';
                    document.getElementById('openaiApiKey').value = data.openaiApiKey || '';
                    // 模型商選擇
                    if (data.activeProvider) document.getElementById('activeProvider').value = data.activeProvider;
                    updateProviderHint();
                    // 開放給使用者的模型勾選
                    const userModels = (data.userModels || '').split(',').map(m => m.trim()).filter(m => m);
                    ['groq', 'gemini', 'deepseek', 'openai'].forEach(m => {
                        const cb = document.getElementById('userModel-' + m);
                        if (cb) cb.checked = userModels.includes(m);
                    });
                    updateAvatarPreview(data.avatarUrl);
                    updateExpiryTimer(data.keyExpiryDate);
                    updateKnowledgeCount(data.knowledgeUrls);
                    showStatus('✅ 設定載入成功！', 'success');
                }
            } catch (e) {
                showStatus('❌ 載入失敗：' + e.message, 'error');
            }
        };

        // 儲存設定
        window.saveConfig = async function () {
            const provider = document.getElementById('activeProvider').value;
            const config = {
                activeProvider: provider,
                userModels: ['groq', 'gemini', 'deepseek', 'openai']
                    .filter(m => document.getElementById('userModel-' + m)?.checked)
                    .join(','),
                groqApiKey: document.getElementById('groqApiKey').value.trim(),
                geminiApiKey: document.getElementById('geminiApiKey').value.trim(),
                deepseekApiKey: document.getElementById('deepseekApiKey').value.trim(),
                openaiApiKey: document.getElementById('openaiApiKey').value.trim(),
                botName: document.getElementById('botName').value.trim() || '兔兔助理',
                prompt: document.getElementById('prompt').value.trim(),
                chips: document.getElementById('chips').value.trim(),
                color: document.getElementById('color').value,
                knowledgeUrls: document.getElementById('knowledgeUrls').value.trim(),
                avatarUrl: document.getElementById('avatarUrl').value.trim(),
                keyExpiryDate: document.getElementById('keyExpiryDate').value,
                updatedAt: new Date().toISOString()
            };
            const keyMap = { groq: 'groqApiKey', gemini: 'geminiApiKey', deepseek: 'deepseekApiKey', openai: 'openaiApiKey' };
            if (!config[keyMap[provider]]) {
                showStatus('❌ 請填寫 ' + provider.toUpperCase() + ' API Key！', 'error');
                return;
            }
            try {
                await setDoc(doc(db, "configs", "bunny-assistant"), config, { merge: true });
                showStatus('✅ 設定儲存成功！', 'success');
                updateKnowledgeCount(config.knowledgeUrls);
            } catch (e) {
                showStatus('❌ 儲存失敗：' + e.message, 'error');
            }
        };

        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = type;
            status.style.display = 'block';
            setTimeout(() => { status.style.display = 'none'; }, 3000);
        }

        // 即時預覽與計數
        function updateAvatarPreview(url) {
            const img = document.getElementById('avatarPreviewImg');
            if (url) {
                img.src = url; img.style.display = 'block';
                img.onerror = () => { img.style.display = 'none'; };
            } else { img.style.display = 'none'; }
        }

        function updateKnowledgeCount(text) {
            const count = text ? text.split('\n').filter(u => u.trim()).length : 0;
            document.getElementById('knowledgeCount').textContent = count;
        }

        function updateExpiryTimer(dateStr) {
            const timerEl = document.getElementById('expiryTimer');
            if (!dateStr) return;
            const diffDays = Math.ceil((new Date(dateStr) - new Date()) / (1000 * 3600 * 24));
            if (diffDays < 0) {
                timerEl.textContent = '❌ 已過期';
                timerEl.classList.add('expiry-warning');
            } else {
                timerEl.textContent = `⏳ API 剩餘 ${diffDays} 天`;
                if (diffDays <= 10) timerEl.classList.add('expiry-warning');
                else timerEl.classList.remove('expiry-warning');
            }
        }

        document.getElementById('avatarUrl').addEventListener('input', (e) => updateAvatarPreview(e.target.value));
        document.getElementById('color').addEventListener('input', (e) => document.getElementById('colorValue').textContent = e.target.value);
        document.getElementById('keyExpiryDate').addEventListener('change', (e) => updateExpiryTimer(e.target.value));

        window.toggleKeyVisibility = function (inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text'; icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password'; icon.className = 'fas fa-eye';
            }
        };

        const providerHints = {
            groq: '🟢 免費方案，速度快，適合日常使用。模型：llama-3.3-70b-versatile',
            gemini: '🔵 Google AI Studio 免費額度充足，模型：gemini-1.5-flash',
            deepseek: '🟣 低成本高效能，適合中文場景。模型：deepseek-chat',
            openai: '🟠 頂級 GPT 系列，品質最高但需付費。模型：gpt-4o-mini'
        };
        window.updateProviderHint = function () {
            const provider = document.getElementById('activeProvider').value;
            document.getElementById('providerHint').textContent = providerHints[provider] || '';
            ['groq', 'gemini', 'deepseek', 'openai'].forEach(p => {
                document.getElementById('group-' + p).style.display = (p === provider) ? 'block' : 'none';
            });
        };

        window.closeAdmin = function () {
            window.close();
            setTimeout(() => { window.history.back(); }, 100);
        };

        loadConfig();
    </script>
</body>

</html>
